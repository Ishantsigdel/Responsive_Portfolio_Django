<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Custom Footer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Boxicons CSS -->
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  
  <style>
    footer {
      height: 200px;
      background-color: #198754;
    }
    .social-icon {
      width: 48px;
      height: 48px;
      border: 2px solid white;
      border-radius: 50%;
      font-size: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      transition: all 0.3s ease;
    }
    .social-icon:hover {
      background-color: white;
      color: #198754;
      transform: scale(1.2);
      box-shadow: 0 0 10px white;
    }
    .social-icon:focus,
    .social-icon:active {
      outline: none;
      box-shadow: none;
    }
  </style>
</head>
<body class="m-0 p-0">

  <!-- Footer -->
  <footer class="container-fluid d-flex flex-column justify-content-center align-items-center text-white">
    <div class="mb-4">
      <a href="https://www.linkedin.com/" class="social-icon mx-2"><i class='bx bxl-linkedin'></i></a>
      <a href="https://github.com/" class="social-icon mx-2"><i class='bx bxl-github'></i></a>
      <a href="https://www.facebook.com/" class="social-icon mx-2"><i class='bx bxl-facebook-circle'></i></a>
      <a href="https://www.instagram.com/" class="social-icon mx-2"><i class='bx bxl-instagram'></i></a>
    </div>
    <p class="m-0">&copy; 2025 Ishant Sigdel – All rights reserved</p>
  </footer>

  <!-- Bootstrap JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
